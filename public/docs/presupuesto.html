<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cotización — Meteoro</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;background:#1a1a1a;display:flex;min-height:100vh}

  /* ─── PANEL FORM ─── */
  #panel-form{width:380px;min-width:340px;background:#111;color:#e8e8e8;display:flex;flex-direction:column;border-right:1px solid #252525;position:sticky;top:0;height:100vh;overflow:hidden}
  .form-brand{background:#000;padding:18px 22px;border-bottom:1px solid #222;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .form-brand img{height:28px;opacity:.8}
  .fb-title{font-size:13px;font-weight:600;color:#fff;letter-spacing:.5px}
  .fb-sub{font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .form-body{padding:16px 18px;flex:1;overflow-y:auto}
  .form-section{margin-bottom:20px}
  .form-section-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #1e1e1e}
  .form-group{margin-bottom:8px}
  label{display:block;font-size:10px;color:#777;margin-bottom:3px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
  input,textarea,select{width:100%;background:#181818;border:1px solid #2a2a2a;color:#e8e8e8;padding:7px 10px;font-size:12px;font-family:'Montserrat',sans-serif;border-radius:3px;outline:none;transition:border-color .15s}
  input:focus,textarea:focus,select:focus{border-color:#444}
  textarea{resize:vertical;min-height:60px}
  select option{background:#181818}
  .form-row{display:flex;gap:8px}
  .form-row .form-group{flex:1}
  .form-check{display:flex;align-items:center;gap:8px;font-size:11px;color:#888;margin-top:5px}
  .form-check input{width:auto}

  /* items dinámicos */
  .item-block{background:#181818;border:1px solid #252525;border-radius:3px;padding:10px;margin-bottom:8px}
  .item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .item-num{font-size:9px;font-weight:700;color:#444;letter-spacing:1px;text-transform:uppercase}
  .btn-rm{background:none;border:none;color:#444;cursor:pointer;font-size:16px;line-height:1;padding:0 3px;transition:color .15s}
  .btn-rm:hover{color:#e55}
  .btn-add{width:100%;padding:7px;background:#181818;border:1px dashed #2e2e2e;color:#555;font-size:11px;font-family:'Montserrat',sans-serif;cursor:pointer;border-radius:3px;margin-top:4px;transition:all .15s}
  .btn-add:hover{border-color:#444;color:#999}

  /* footer form */
  .form-footer{padding:12px 18px;background:#111;border-top:1px solid #1e1e1e;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
  .btn-pdf{width:100%;padding:11px;background:#fff;color:#000;border:none;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:background .15s}
  .btn-pdf:hover{background:#ddd}

  /* ─── PANEL PREVIEW ─── */
  #panel-preview{flex:1;padding:40px 30px;display:flex;flex-direction:column;align-items:center;background:#2a2a2a;overflow-y:auto}

  /* ─── DOCUMENTO ─── */
  .doc{width:794px;background:#fff;color:#000;box-shadow:0 8px 40px rgba(0,0,0,.5);font-family:'Montserrat',sans-serif;position:relative;min-height:1100px}

  .marco-documento{position:absolute;top:20px;bottom:20px;left:20px;right:20px;border:1px solid rgba(0,0,0,.1);pointer-events:none;z-index:5}
  .marco-documento::before,.marco-documento::after{content:'';position:absolute;width:14px;height:14px;border:1px solid rgba(0,0,0,.8)}
  .marco-documento::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .marco-documento::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

  .doc-container{padding:55px 48px;position:relative;z-index:2}

  .doc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}
  .doc-header img{height:42px;filter:invert(1)}
  .doc-header-right{text-align:right}
  .dh-label{font-size:9px;color:#888;letter-spacing:2px;text-transform:uppercase}
  .dh-client{font-size:15px;font-weight:600;margin-top:4px;letter-spacing:.5px}

  .doc-title-band{position:relative;padding:28px 0;margin-bottom:28px;text-align:center}
  .doc-title-band::before,.doc-title-band::after{content:'';position:absolute;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.4),transparent)}
  .doc-title-band::before{top:0}.doc-title-band::after{bottom:0}
  .acento-linea{position:absolute;left:50%;transform:translateX(-50%);width:6px;height:6px;background:#000}
  .acento-arriba{top:-3px}.acento-abajo{bottom:-3px}
  .doc-cot-label{font-size:9px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#777;margin-bottom:8px}
  .doc-ptitle{font-size:26px;font-weight:300;letter-spacing:4px;text-transform:uppercase;margin:0;color:#000}
  .doc-tagline{font-size:9px;color:#999;margin-top:12px;letter-spacing:5px;text-transform:uppercase}

  .doc-meta{display:flex;justify-content:space-between;padding-bottom:22px;margin-bottom:28px;border-bottom:1px solid #eee}
  .doc-meta-item{display:flex;flex-direction:column}
  .doc-meta-lbl{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#999;margin-bottom:4px;font-weight:600}
  .doc-meta-val{font-size:12px;font-weight:500;color:#222}

  .doc-subsection-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#000;margin-bottom:18px;padding-bottom:8px;border-bottom:1px solid #ddd}

  .timeline-grid{display:flex;gap:22px;margin-bottom:45px}
  .timeline-step{flex:1;border-top:3px solid #000;padding-top:14px}
  .step-number{font-size:22px;font-weight:200;color:#000;margin-bottom:8px;letter-spacing:2px}
  .step-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .step-desc{font-size:10px;color:#666;line-height:1.5}

  .doc-table{width:100%;border-collapse:collapse;margin-bottom:0}
  .doc-table thead tr{background:#000}
  .doc-table th{padding:13px 11px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-align:left;color:#fff}
  .doc-table th.r,.doc-table td.r{text-align:right}
  .doc-table td{padding:13px 11px;font-size:12px;vertical-align:top;border-bottom:1px solid #f0f0f0}
  .td-name{font-weight:600;letter-spacing:.5px}
  .td-desc{font-weight:400;color:#777;font-size:10px;margin-top:5px;line-height:1.4}

  .doc-totals{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-bottom:45px;margin-top:0}
  .tot-row{display:flex;justify-content:space-between;width:280px;font-size:12px;color:#666}
  .tot-final{display:flex;justify-content:space-between;width:280px;padding:13px 0;margin-top:4px;border-top:2px solid #000;border-bottom:2px solid #000}
  .tot-final .tl{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
  .tot-final .tv{font-size:16px;font-weight:700}

  .plans-grid{display:flex;gap:18px;margin-bottom:45px}
  .plan-card{flex:1;border:1px solid #e0e0e0;padding:26px 22px;display:flex;flex-direction:column;background:#fff;color:#000;position:relative}
  .plan-premium{background:#000;color:#fff;border-color:#000;transform:scale(1.03);box-shadow:0 8px 22px rgba(0,0,0,.15);z-index:2}
  .plan-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
  .plan-price{font-size:24px;font-weight:300;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #eee}
  .plan-premium .plan-price{border-bottom-color:#333}
  .plan-period{font-size:10px;color:#888;font-weight:500;letter-spacing:1px}
  .plan-features{list-style:none;padding:0;margin:0;font-size:10px;line-height:1.6}
  .plan-features li{margin-bottom:8px;padding-left:16px;position:relative;color:#666}
  .plan-premium .plan-features li{color:#ccc}
  .plan-features li::before{content:'■';position:absolute;left:0;top:0;font-size:8px;color:#000}
  .plan-premium .plan-features li::before{color:#fff}

  .payment-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:45px}
  .payment-card{border:1px solid #333;background:#000;color:#fff;padding:18px 22px}
  .payment-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #333;color:#fff}
  .pay-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:10px;line-height:1.4}
  .pay-lbl{color:#888;font-weight:500}
  .pay-val{color:#fff;font-weight:600;text-align:right;max-width:60%;word-break:break-all}

  .doc-notes-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#999;margin-bottom:8px}
  .doc-notes-txt{font-size:11px;font-weight:400;color:#555;line-height:1.6;margin-bottom:16px}
  .doc-validez{font-size:10px;font-style:italic;color:#aaa;margin-bottom:45px}

  .doc-footer{display:flex;justify-content:space-between;align-items:center;padding-top:26px;border-top:1px solid #eee}
  .doc-footer-contacts{display:flex;gap:36px}
  .dfc-item{display:flex;flex-direction:column}
  .dfc-lbl{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px}
  .dfc-val{font-size:10px;font-weight:500;color:#444}

  @media print{
    body{background:#fff!important}
    #panel-form{display:none!important}
    #panel-preview{padding:0!important;background:#fff!important;align-items:flex-start!important}
    .doc{box-shadow:none!important;width:100%!important;min-height:auto!important}
    @page{margin:0;size:A4}
  }
</style>
</head>

  <div class="form-body">

    <div class="form-section">
      <div class="form-section-title">Cliente</div>
      <div class="form-group"><label>Nombre / Empresa</label><input type="text" id="f-cliente" placeholder="Ej: Opptima S.A." oninput="up()"></div>
      <div class="form-group"><label>Título del proyecto</label><input type="text" id="f-proyecto" placeholder="Ej: Landing Page en GoHighLevel" oninput="up()"></div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Cotización</div>
      <div class="form-row">
        <div class="form-group"><label>Número</label><input type="text" id="f-numero" placeholder="001" oninput="up()"></div>
        <div class="form-group"><label>Fecha</label><input type="date" id="f-fecha" oninput="up()"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Moneda</label>
          <select id="f-moneda" onchange="up()">
            <option value="ARS">ARS — Pesos</option>
            <option value="USD">USD — Dólares</option>
            <option value="EUR">EUR — Euros</option>
            <option value="USDT">USDT — Cripto</option>
          </select>
        </div>
        <div class="form-group"><label>Validez (días)</label><input type="number" id="f-validez" value="15" min="1" oninput="up()"></div>
      </div>
      <div class="form-check">
        <input type="checkbox" id="f-iva" onchange="up()">
        <label for="f-iva" style="margin-bottom:0;text-transform:none;letter-spacing:0;font-size:11px">Incluir IVA (21%)</label>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Ítems</div>
      <div id="items-list"></div>
      <button class="btn-add" onclick="addItem()">+ Agregar ítem</button>
    </div>

    <div class="form-section">
      <div class="form-section-title">Notas y condiciones</div>
      <div class="form-group"><textarea id="f-notas" rows="3" placeholder="Pago 50% adelantado / 50% contra entrega." oninput="up()"></textarea></div>
    </div>

    <div class="form-section">
      <div class="form-section-title">Preparado por</div>

let items = [{ nombre: '', descripcion: '', cantidad: 1, precio: 0 }];

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function gv(id){ const e=document.getElementById(id); return e?e.value.trim():'' }
function today(){ return new Date().toISOString().slice(0,10) }
function fmtDate(iso){ if(!iso)return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y }

function fmtMoney(n, mon){
  const sym = mon==='USD'?'USD ':mon==='EUR'?'€ ':mon==='USDT'?'USDT ':' $ ';
  return sym + Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function totals(){
  const sub = items.reduce((a,it)=>a+(it.cantidad*it.precio),0);
  const iva = document.getElementById('f-iva').checked ? sub*0.21 : 0;
  return {sub, iva, total: sub+iva};
}

function renderItems(){
  const l = document.getElementById('items-list');
  l.innerHTML = '';
  items.forEach((it,i)=>{
    l.innerHTML += `<div class="item-block">
      <div class="item-header"><span class="item-num">Ítem ${i+1}</span><button class="btn-rm" onclick="rmItem(${i})">×</button></div>
      <div class="form-group"><label>Nombre / Servicio</label><input type="text" value="${esc(it.nombre)}" placeholder="Ej: Diseño de landing page" oninput="si(${i},'nombre',this.value)"></div>
      <div class="form-group"><label>Descripción (opcional)</label><input type="text" value="${esc(it.descripcion)}" placeholder="Detalle breve" oninput="si(${i},'descripcion',this.value)"></div>
      <div class="form-row">
        <div class="form-group"><label>Cantidad</label><input type="number" value="${it.cantidad}" min="1" oninput="si(${i},'cantidad',+this.value)"></div>
        <div class="form-group"><label>Precio unitario</label><input type="number" value="${it.precio}" min="0" step="100" oninput="si(${i},'precio',+this.value)"></div>
      </div>
    </div>`;
  });
}

function addItem(){ items.push({nombre:'',descripcion:'',cantidad:1,precio:0}); renderItems(); up() }
function rmItem(i){ if(items.length===1)return; items.splice(i,1); renderItems(); up() }
function si(i,f,v){ items[i][f]=v; up() }

    rows += `<tr>
      <td>${i+1}</td>

      <div class="timeline-step"><div class="step-number">02</div><div class="step-title">Lanzar</div><div class="step-desc">Diseño, desarrollo técnico, integraciones y dos rondas de revisión para asegurar calidad y alineación.</div></div>
      <div class="timeline-step"><div class="step-number">03</div><div class="step-title">Crecer</div><div class="step-desc">Pruebas finales, migración a producción, entrega de accesos y capacitación sobre el uso del servicio.</div></div>
    </div>

    <div class="doc-subsection-title">Propuesta</div>
    <table class="doc-table">
      <thead><tr>
        <th style="width:4%">#</th>
        <th>Descripción (Inversión Única)</th>

      <tbody>${rows}</tbody>
    </table>
    <div class="doc-totals">${tots}</div>

    <div class="doc-subsection-title">Planes de Mantenimiento Mensual</div>
    <div class="plans-grid">
      <div class="plan-card">
        <div class="plan-name">Mantenimiento Básico</div>

    </div>

    <div class="payment-grid">

      <div class="payment-card"><div class="payment-title">Criptomoneda USDT</div>

        <div class="pay-row"><span class="pay-lbl">Dirección</span><span class="pay-val">TJUXpBfLviEbBV53SnRZRdatfhgwEFcA86</span></div>

    </div>

    ${notasHtml}
    <div class="doc-validez">Esta cotización tiene validez de ${validez} días hábiles desde la fecha de emisión.</div>

  </div>`;

const _p = new URLSearchParams(location.search);
