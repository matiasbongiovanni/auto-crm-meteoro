<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador — Meteoro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #1a1a1a;
      display: flex;
      min-height: 100vh
    }

    /* --- layout --- */
    #panel-form {
      width: 370px;
      min-width: 320px;
      background: #111;
      color: #e8e8e8;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #252525;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden
    }

    #panel-preview {
      flex: 1;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #2a2a2a;
      overflow-y: auto
    }

    /* --- form panel header --- */
    .form-brand {
      background: #000;
      padding: 20px 22px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0
    }

    .form-brand img {
      height: 32px
    }

    .form-brand-text {
      display: flex;
      flex-direction: column
    }

    .form-brand-text .fb-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      letter-spacing: .04em;
      line-height: 1
    }

    .form-brand-text .fb-sub {
      font-size: 9px;
      color: #666;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-top: 3px
    }

    /* --- form body --- */
    .form-body {
      padding: 18px 20px 16px;
      flex: 1;
      overflow-y: auto
    }

    .form-section {
      margin-bottom: 22px
    }

    .form-section-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #1e1e1e
    }

    .form-group {
      margin-bottom: 9px
    }

    label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
      font-weight: 500
    }

    input[type=text],
    input[type=number],
    input[type=date],
    textarea,
    select {
      width: 100%;
      background: #181818;
      border: 1px solid #2a2a2a;
      color: #e8e8e8;
      padding: 7px 10px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      border-radius: 4px;
      outline: none;
      transition: border-color .15s
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #444
    }

    textarea {
      resize: vertical;
      min-height: 60px
    }

    select option {
      background: #181818
    }

    .form-row {
      display: flex;
      gap: 8px
    }

    .form-row .form-group {
      flex: 1
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #aaa;
      gap: 7px;
      margin-top: 5px
    }

    .checkbox-row input {
      width: auto
    }

    /* --- items --- */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .item-block {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 5px;
      padding: 10px
    }

    .section-hint {
      font-size: 10px;
      line-height: 1.45;
      color: #7a7a7a;
      margin-top: 4px;
      margin-bottom: 10px
    }

    .section-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 11px;
      color: #aaa
    }

    .section-toggle input {
      width: auto
    }

    .item-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px
    }

    .item-num {
      font-size: 9px;
      font-weight: 700;
      color: #444;
      letter-spacing: .1em;
      text-transform: uppercase
    }

    .btn-rm {
      background: none;
      border: none;
      color: #444;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      padding: 0 2px;
      transition: color .15s
    }

    .btn-rm:hover {
      color: #e55
    }

    .btn-add {
      width: 100%;
      padding: 8px;
      background: #181818;
      border: 1px dashed #2e2e2e;
      color: #555;
      font-size: 11px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      border-radius: 4px;
      margin-top: 8px;
      transition: all .15s
    }

    .btn-add:hover {
      border-color: #444;
      color: #999
    }

    .doc-subsection {
      margin-top: 22px
    }

    .doc-subsection-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 10px
    }

    .td-list {
      margin-top: 5px;
      padding-left: 16px;
      color: #777;
      font-size: 11px
    }

    .td-list li {
      margin-top: 2px
    }

    /* --- footer --- */
    .form-footer {
      padding: 14px 20px;
      background: #111;
      border-top: 1px solid #1e1e1e;
      flex-shrink: 0
    }

    .btn-pdf {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      border: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: background .15s
    }

    .btn-pdf:hover {
      background: #ddd
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: #d8b04d;
      color: #111;
      border: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: background .15s;
      margin-top: 8px
    }

    .btn-save:hover {
      background: #f1c85f
    }

    .save-status {
      margin-top: 8px;
      font-size: 11px;
      color: #777;
      line-height: 1.4
    }

    /* ============================================================
   DOCUMENTO
   ============================================================ */
    .doc {
      width: 794px;
      min-height: 1123px;
      background: #fff;
      color: #000;
      box-shadow: 0 8px 40px rgba(0, 0, 0, .5);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column
    }

    /* header negro */
    .doc-header {
      background: #000;
      padding: 26px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0
    }

    .doc-header img {
      height: 42px
    }

    .doc-header-right {
      text-align: right
    }

    .doc-header-right .dh-label {
      font-size: 10px;
      color: #666;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 500
    }

    .doc-header-right .dh-client {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-top: 2px
    }

    /* banda título */
    .doc-title-band {
      background: #f5f5f5;
      border-bottom: 3px solid #000;
      padding: 30px 48px
    }

    .doc-cot-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 6px
    }

    .doc-ptitle {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 38px;
      color: #000;
      line-height: 1.05;
      letter-spacing: .01em
    }

    .doc-tagline {
      font-size: 11px;
      color: #bbb;
      margin-top: 7px;
      font-style: italic;
      letter-spacing: .06em
    }

    /* meta */
    .doc-meta {
      padding: 18px 48px;
      display: flex;
      gap: 36px;
      border-bottom: 1px solid #ececec
    }

    .doc-meta-item {
      display: flex;
      flex-direction: column
    }

    .doc-meta-lbl {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 3px
    }

    .doc-meta-val {
      font-size: 13px;
      font-weight: 600;
      color: #000
    }

    /* body */
    .doc-body {
      padding: 28px 48px;
      flex: 1
    }

    /* tabla */
    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 0
    }

    .doc-table thead tr {
      background: #000;
      color: #fff
    }

    .doc-table thead th {
      padding: 9px 13px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-align: left
    }

    .doc-table thead th.r {
      text-align: right
    }

    .doc-table tbody tr {
      border-bottom: 1px solid #f0f0f0
    }

    .doc-table tbody tr:last-child {
      border-bottom: none
    }

    .doc-table tbody td {
      padding: 11px 13px;
      font-size: 13px;
      vertical-align: top
    }

    .doc-table tbody td.r {
      text-align: right;
      white-space: nowrap
    }

    .td-name {
      font-weight: 600
    }

    .td-desc {
      font-weight: 400;
      color: #888;
      font-size: 11px;
      margin-top: 2px
    }

    /* totales */
    .doc-totals {
      margin-top: 0;
      border-top: 2px solid #000;
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px
    }

    .tot-row {
      display: flex;
      justify-content: space-between;
      width: 260px
    }

    .tot-row .tl {
      font-size: 12px;
      color: #999
    }

    .tot-row .tv {
      font-size: 13px;
      font-weight: 600;
      color: #000;
      text-align: right
    }

    .tot-final {
      display: flex;
      justify-content: space-between;
      width: 260px;
      background: #000;
      padding: 9px 14px;
      margin-top: 5px;
      border-radius: 3px
    }

    .tot-final .tl {
      font-size: 11px;
      color: #aaa;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase
    }

    .tot-final .tv {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-align: right
    }

    /* notas */
    .doc-notes {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid #ececec
    }

    .doc-notes-lbl {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 7px
    }

    .doc-notes-txt {
      font-size: 12px;
      color: #555;
      line-height: 1.75;
      white-space: pre-wrap
    }

    /* validez */
    .doc-validez {
      margin-top: 16px;
      font-size: 11px;
      color: #ccc;
      font-style: italic
    }

    /* footer */
    .doc-footer {
      background: #000;
      padding: 16px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      flex-shrink: 0
    }

    .doc-footer-contacts {
      display: flex;
      gap: 24px
    }

    .dfc-item {
      display: flex;
      flex-direction: column
    }

    .dfc-item .dfc-lbl {
      font-size: 8px;
      color: #555;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 2px
    }

    .dfc-item .dfc-val {
      font-size: 11px;
      color: #ccc;
      font-weight: 500
    }

    .doc-footer-logo img {
      height: 26px;
      opacity: .65
    }

    /* ============================================================
   PRINT
   ============================================================ */
    @media print {
      body {
        background: #fff !important
      }

      #panel-form {
        display: none !important
      }

      #panel-preview {
        padding: 0 !important;
        background: #fff !important;
        align-items: flex-start !important
      }

      .doc {
        box-shadow: none !important;
        width: 100% !important
      }

      @page {
        margin: 0;
        size: A4
      }
    }
  </style>
</head>

    <div class="form-body">
      <div class="form-section">
        <div class="form-section-title">Cliente</div>
        <div class="form-group">
          <label>Nombre / Empresa</label>
          <input type="text" id="f-cliente" placeholder="Ej: Opptima S.A." oninput="up()">
        </div>
        <div class="form-group">
          <label>Título del proyecto</label>
          <input type="text" id="f-proyecto" placeholder="Ej: Landing Page en GoHighLevel" oninput="up()">
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Cotización</div>
        <div class="form-row">
          <div class="form-group">
            <label>Número</label>
            <input type="text" id="f-numero" placeholder="001" oninput="up()">
          </div>
          <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="f-fecha" oninput="up()">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Moneda</label>
            <select id="f-moneda" onchange="up()">
              <option value="ARS">ARS — Pesos</option>
              <option value="USD">USD — Dólares</option>
              <option value="EUR">EUR — Euros</option>
            </select>
          </div>
          <div class="form-group">
            <label>Validez (días)</label>
            <input type="number" id="f-validez" value="15" min="1" oninput="up()">
          </div>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="f-iva" onchange="up()">
          <label for="f-iva" style="margin-bottom:0">Incluir IVA (21%)</label>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Ítems</div>
        <div class="items-list" id="items-list"></div>
        <button class="btn-add" onclick="addItem()">+ Agregar ítem</button>
      </div>

      <div class="form-section">
        <div class="form-section-title">Planes mensuales</div>
        <div class="section-toggle">
          <input type="checkbox" id="f-enable-plans" onchange="togglePlans()">
          <label for="f-enable-plans" style="margin-bottom:0">Incluir planes mensuales</label>
        </div>
        <div class="section-hint">Usá esta sección para propuestas de mantenimiento, soporte o suscripción mensual.</div>
        <div id="plans-wrap" style="display:none">
          <div class="items-list" id="plans-list"></div>
          <button class="btn-add" onclick="addPlan()">+ Agregar plan mensual</button>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Notas / Condiciones</div>
        <div class="form-group">
          <textarea id="f-notas" placeholder="Ej: Pago 50% adelantado. Precio no incluye dominio ni hosting."
            oninput="up()"></textarea>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Preparado por</div>
        <div class="form-group">
          <input type="text" id="f-prep" value="Matías Bongiovanni — Meteoro" oninput="up()">
        </div>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn-pdf" onclick="window.print()">Descargar PDF</button>
      <button class="btn-save" onclick="saveQuote()">Guardar en CRM</button>
      <div class="save-status" id="save-status">El guardado se sincroniza con el CRM Meteoro.</div>
    </div>
  </aside>

  <main id="panel-preview">
    <div class="doc" id="doc"></div>
  </main>

  <script>
    const LOGO = "https://ibb.co/tMMydQGs"

    let items = [{ nombre: '', descripcion: '', cantidad: 1, precio: 0 }];
    let plans = [];

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmt(n, m) {
      const sym = m === 'USD' ? 'USD ' : m === 'EUR' ? '€ ' : '$ ';
      return sym + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function today() { return new Date().toISOString().slice(0, 10) }
    function fmtDate(iso) { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}` }
    function gv(id) { const e = document.getElementById(id); return e ? e.value.trim() : '' }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2) }

    function quoteSnapshot() {
      const cli = gv('f-cliente');
      const proy = gv('f-proyecto');
      const num = gv('f-numero') || '001';
      const fecha = gv('f-fecha') || today();
      const mon = gv('f-moneda') || 'ARS';
      const val = parseInt(gv('f-validez')) || 15;
      const notas = gv('f-notas');
      const prep = gv('f-prep') || 'Matías Bongiovanni — Meteoro';
      const conIva = document.getElementById('f-iva').checked;
      const plansEnabled = document.getElementById('f-enable-plans').checked;
      const { sub, iva, total } = totals();
      return {
        id: uid(),
        numero: num,
        cliente: cli,
        proyecto: proy,
        fecha,
        moneda: mon,
        validez: val,
        incluyeIva: conIva,
        subtotal: sub,
        iva,
        total,
        itemsCount: items.length,
        plansEnabled,
        items: items.map(it => ({ ...it })),
        plans: plansEnabled ? plans.map(pl => ({ ...pl })) : [],
        notas,
        preparadoPor: prep,
        savedAt: new Date().toISOString()
      };
    }

    function postQuoteToParent(quote) {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'meteoro-quote-saved', payload: quote }, '*');
        }
      } catch {}
    }

    function renderItems() {
      const l = document.getElementById('items-list');
      l.innerHTML = '';
      items.forEach((it, i) => {
        l.innerHTML += `<div class="item-block">
      <div class="item-block-header"><span class="item-num">Ítem ${i + 1}</span><button class="btn-rm" onclick="rmItem(${i})">×</button></div>
      <div class="form-group"><label>Nombre / Servicio</label><input type="text" value="${esc(it.nombre)}" placeholder="Ej: Diseño de landing page" oninput="si(${i},'nombre',this.value)"></div>
      <div class="form-group"><label>Descripción (opcional)</label><input type="text" value="${esc(it.descripcion)}" placeholder="Detalle breve" oninput="si(${i},'descripcion',this.value)"></div>
      <div class="form-row">
        <div class="form-group"><label>Cantidad</label><input type="number" value="${it.cantidad}" min="1" oninput="si(${i},'cantidad',this.value)"></div>
        <div class="form-group"><label>Precio unitario</label><input type="number" value="${it.precio}" min="0" step="100" oninput="si(${i},'precio',this.value)"></div>
      </div></div>`;
      });
    }

    function renderPlans() {
      const l = document.getElementById('plans-list');
      l.innerHTML = '';
      plans.forEach((pl, i) => {
        l.innerHTML += `<div class="item-block">
      <div class="item-block-header"><span class="item-num">Plan ${i + 1}</span><button class="btn-rm" onclick="rmPlan(${i})">×</button></div>
      <div class="form-group"><label>Nombre del plan</label><input type="text" value="${esc(pl.nombre)}" placeholder="Ej: Mantenimiento mensual" oninput="sp(${i},'nombre',this.value)"></div>
      <div class="form-group"><label>Descripción en lista</label><textarea placeholder="Un punto por línea" oninput="sp(${i},'descripcion',this.value)">${esc(pl.descripcion)}</textarea></div>
      <div class="form-group"><label>Precio mensual</label><input type="number" value="${pl.precio}" min="0" step="100" oninput="sp(${i},'precio',this.value)"></div>
    </div>`;
      });
    }

    function addItem() { items.push({ nombre: '', descripcion: '', cantidad: 1, precio: 0 }); renderItems(); up() }
    function rmItem(i) { if (items.length === 1) return; items.splice(i, 1); renderItems(); up() }
    function si(i, f, v) { items[i][f] = (f === 'cantidad' || f === 'precio') ? parseFloat(v) || 0 : v; up() }

    function addPlan() { plans.push({ nombre: '', descripcion: '', precio: 0 }); renderPlans(); up() }
    function rmPlan(i) { if (plans.length === 1) return; plans.splice(i, 1); renderPlans(); up() }
    function sp(i, f, v) { plans[i][f] = f === 'precio' ? parseFloat(v) || 0 : v; up() }
    function togglePlans() {
      const enabled = document.getElementById('f-enable-plans').checked;
      document.getElementById('plans-wrap').style.display = enabled ? 'block' : 'none';
      if (enabled && plans.length === 0) {
        plans.push({ nombre: '', descripcion: '', precio: 0 });
        renderPlans();
      }
      up();
    }

    function totals() {
      const sub = items.reduce((a, it) => a + (it.cantidad * it.precio), 0);
      const iva = document.getElementById('f-iva').checked ? sub * 0.21 : 0;
      return { sub, iva, total: sub + iva };
    }

    function listHtml(text) {
      const lines = String(text || '')
        .split(/\r?\n/)
        .map(s => s.trim())
        .filter(Boolean);
      return lines.length ? `<ul class="td-list">${lines.map(line => `<li>${esc(line)}</li>`).join('')}</ul>` : '';
    }

    function up() {
      const cli = gv('f-cliente');
      const proy = gv('f-proyecto');
      const num = gv('f-numero') || '001';
      const fecha = gv('f-fecha') || today();
      const mon = gv('f-moneda') || 'ARS';
      const val = parseInt(gv('f-validez')) || 15;
      const notas = gv('f-notas');
      const prep = gv('f-prep') || 'Matías Bongiovanni — Meteoro';
      const conIva = document.getElementById('f-iva').checked;
      const plansEnabled = document.getElementById('f-enable-plans').checked;
      const { sub, iva, total } = totals();

      let rows = '';
      items.forEach((it, i) => {
        const nm = it.nombre || `Ítem ${i + 1}`;
        rows += `<tr>
      <td>${i + 1}</td>
      <td class="td-name">${esc(nm)}${it.descripcion ? `<div class="td-desc">${esc(it.descripcion)}</div>` : ''}</td>
      <td>${it.cantidad}</td>
      <td class="r">${fmt(it.precio, mon)}</td>
      <td class="r">${fmt(it.cantidad * it.precio, mon)}</td>
    </tr>`;
      });

      let tots = '';
      if (conIva) {
        tots += `<div class="tot-row"><span class="tl">Subtotal</span><span class="tv">${fmt(sub, mon)}</span></div>
    <div class="tot-row"><span class="tl">IVA (21%)</span><span class="tv">${fmt(iva, mon)}</span></div>`;
      }
      tots += `<div class="tot-final"><span class="tl">Total</span><span class="tv">${fmt(total, mon)}</span></div>`;

      const notasHtml = notas ? `<div class="doc-notes"><div class="doc-notes-lbl">Notas y condiciones</div><div class="doc-notes-txt">${esc(notas)}</div></div>` : '';

      document.getElementById('doc').innerHTML = `

    function saveQuote() {
      const quote = quoteSnapshot();
      try {
        const saved = JSON.parse(localStorage.getItem('meteoro-quotes') || '[]');
        const idx = saved.findIndex(q => q.numero === quote.numero && q.cliente === quote.cliente);
        if (idx >= 0) saved[idx] = quote;
        else saved.unshift(quote);
        localStorage.setItem('meteoro-quotes', JSON.stringify(saved.slice(0, 50)));
      } catch {}
      postQuoteToParent(quote);
      const status = document.getElementById('save-status');
      if (status) status.textContent = `Cotización ${quote.numero} enviada al CRM.`;
    }

    // init
    // Pre-fill desde URL params (pasados por el CRM)
    const _p = new URLSearchParams(location.search);
    if (_p.get('cliente')) document.getElementById('f-cliente').value = _p.get('cliente');
    if (_p.get('proyecto')) document.getElementById('f-proyecto').value = _p.get('proyecto');
    document.getElementById('f-fecha').value = today();
    renderItems();
    renderPlans();
    togglePlans();
    up();
  </script>
