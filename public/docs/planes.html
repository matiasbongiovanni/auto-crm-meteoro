<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Planes — Meteoro</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#1a1a1a;display:flex;min-height:100vh}
    #panel-form{width:390px;min-width:330px;background:#111;color:#e8e8e8;display:flex;flex-direction:column;border-right:1px solid #252525;position:sticky;top:0;height:100vh;overflow:hidden}
    #panel-preview{flex:1;padding:40px 32px;display:flex;flex-direction:column;align-items:center;background:#2a2a2a;overflow-y:auto}
    .form-brand{background:#000;padding:20px 22px;border-bottom:1px solid #222;display:flex;align-items:center;gap:14px;flex-shrink:0}
    .form-brand img{height:32px}
    .form-brand-text{display:flex;flex-direction:column}
    .fb-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;color:#fff;letter-spacing:.04em;line-height:1}
    .fb-sub{font-size:9px;color:#666;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
    .form-body{padding:18px 20px 16px;flex:1;overflow-y:auto}
    .form-section{margin-bottom:22px}
    .form-section-title{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#555;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #1e1e1e}
    .form-group{margin-bottom:9px}
    label{display:block;font-size:11px;color:#888;margin-bottom:3px;font-weight:500}
    input[type=text],input[type=number],select,textarea{width:100%;background:#181818;border:1px solid #2a2a2a;color:#e8e8e8;padding:7px 10px;font-size:12px;font-family:'Inter',sans-serif;border-radius:4px;outline:none;transition:border-color .15s}
    input:focus,textarea:focus,select:focus{border-color:#444}
    textarea{resize:vertical;min-height:60px}
    select option{background:#181818}
    .form-row{display:flex;gap:8px}
    .form-row .form-group{flex:1}
    .form-check{display:flex;align-items:center;gap:8px;font-size:11px;color:#888;margin-top:6px}
    .form-check input{width:14px;height:14px;accent-color:#fff;flex-shrink:0}
    .tipo-selector{display:flex;gap:6px;margin-bottom:20px}
    .tipo-btn{flex:1;padding:9px 6px;background:#181818;border:1px solid #2a2a2a;color:#666;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;border-radius:4px;transition:all .15s;text-align:center;letter-spacing:.04em}
    .tipo-btn.active{background:#fff;color:#000;border-color:#fff}
    .tipo-btn:hover:not(.active){border-color:#444;color:#aaa}
    .btn-pdf{width:100%;padding:12px;background:#fff;color:#000;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:4px;transition:background .15s}
    .btn-pdf:hover{background:#ddd}
    .footer-hint{margin-top:7px;font-size:10px;color:#555;text-align:center}
    .doc{width:794px;min-height:1123px;background:#fff;color:#000;box-shadow:0 8px 40px rgba(0,0,0,.5);font-family:'Inter',sans-serif;display:flex;flex-direction:column}
    .doc-scale{width:794px;display:flex;flex-direction:column;transform-origin:top left}
    .doc-header{background:#000;padding:24px 48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .doc-header img{height:64px}
    .doc-header-right{text-align:right}
    .dh-label{font-size:9px;color:#666;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
    .dh-title{font-size:14px;font-weight:600;color:#fff;margin-top:2px}
    .doc-title-band{background:#f5f5f5;border-bottom:3px solid #000;padding:28px 48px}
    .doc-badge{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#aaa;margin-bottom:6px}
    .doc-ptitle{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:38px;color:#000;line-height:1.05;letter-spacing:.01em}
    .doc-tagline{font-size:11px;color:#bbb;margin-top:6px;font-style:italic}
    .doc-meta{padding:16px 48px;display:flex;gap:32px;border-bottom:1px solid #ececec;flex-wrap:wrap}
    .doc-meta-item{display:flex;flex-direction:column}
    .doc-meta-lbl{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#bbb;margin-bottom:3px}
    .doc-meta-val{font-size:13px;font-weight:600;color:#000}
    .doc-body{padding:28px 48px;flex:1}
    .doc-section{margin-bottom:26px;break-inside:avoid;page-break-inside:avoid}
    .doc-section-title{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#000;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #000}
    .plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .plan-card{background:#f7f7f7;border:1px solid #ececec;border-radius:14px;padding:16px}
    .plan-badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:#000;color:#fff;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
    .plan-title{font-size:18px;font-weight:700;color:#000;line-height:1.1}
    .plan-hours{font-size:11px;font-weight:700;color:#666;margin-top:5px;text-transform:uppercase;letter-spacing:.08em}
    .plan-desc{font-size:13px;color:#333;line-height:1.65;margin-top:10px}
    .plan-bullets{list-style:none;padding:0;margin-top:12px}
    .plan-bullets li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13px;color:#333;border-top:1px solid #eee}
    .plan-dot{width:7px;height:7px;border-radius:999px;background:#000;margin-top:7px;flex-shrink:0}
    .doc-signature{padding:24px 48px;border-top:1px solid #ececec;display:grid;grid-template-columns:1fr 1fr;gap:40px;break-inside:avoid;page-break-inside:avoid}
    .sig-label{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#bbb;margin-bottom:24px}
    .sig-line{border-bottom:1px solid #000;width:100%;margin-bottom:8px}
    .sig-name{font-size:13px;font-weight:600;color:#000}
    .sig-role{font-size:10px;color:#999;margin-top:2px}
    .sig-date{font-size:10px;color:#bbb;margin-top:4px}
    .doc-footer{background:#000;padding:14px 48px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;break-inside:avoid;page-break-inside:avoid}
    .doc-footer-contacts{display:flex;gap:22px}
    .dfc-item{display:flex;flex-direction:column}
    .dfc-lbl{font-size:8px;color:#555;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:2px}
    .dfc-val{font-size:11px;color:#ccc;font-weight:500}
    .doc-footer-logo img{height:36px;opacity:.6}
    .muted{font-size:13px;color:#bbb}
    @media print{
      body{background:#fff!important}
      #panel-form{display:none!important}
      #panel-preview{padding:0!important;background:#fff!important;align-items:flex-start!important;justify-content:flex-start!important;overflow:visible!important}
      .doc{box-shadow:none!important;width:794px!important;min-height:auto!important;height:auto!important;overflow:visible!important;display:block!important}
      .doc-scale{width:794px!important;display:block!important;transform:none!important}
      @page{margin:12mm;size:A4}
    }
  </style>
</head>

let tipo = "bienvenida";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;") }
function gv(id){ const e=document.getElementById(id); return e?e.value.trim():"" }
function today(){ return new Date().toISOString().slice(0,10) }
function fmtDate(iso){ if(!iso)return "—"; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y }
function setTipo(t, btn){ tipo=t; document.querySelectorAll(".tipo-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); up() }
function firmaHTML(lado, nombre, cargo){ return `<div class="sig-block"><div class="sig-label">${esc(lado)}</div><div class="sig-line"></div><div class="sig-name">${esc(nombre||"—")}</div><div class="sig-role">${esc(cargo||"")}</div><div class="sig-date">Fecha: _____ / _____ / _________</div></div>` }
function up(){
  const titleShow = document.getElementById("f-title-show")?.checked ?? true;
  const itemsShow = document.getElementById("f-items-show")?.checked ?? true;
  const title = gv("f-title") || "Plan de mantenimiento mensual";
  const hours = gv("f-hours") || "0 hs/mes";
  const desc = gv("f-desc") || "";
  const items = gv("f-items") || "";
  const client = gv("f-cliente") || "Cliente";
  const company = gv("f-empresa");
  const date = gv("f-fecha") || today();
  const type = tipo === "bienvenida" ? "Bienvenida" : "Onboarding";
  const itemsHTML = itemsShow && items ? `<ul class="plan-bullets">${items.split("\n").filter(Boolean).map((item)=>`<li><span class="plan-dot"></span><span>${esc(item)}</span></li>`).join("")}</ul>` : "";
  document.getElementById("doc").innerHTML = `
    <div class="doc-scale">
      <div class="doc-header">
        <img src="${LOGO}" alt="Meteoro">
        <div class="doc-header-right">
          <div class="dh-label">Documento de</div>
          <div class="dh-title">Planes</div>
        </div>
      </div>
      <div class="doc-title-band">
        <div class="doc-badge">Planes / mantenciones / horas mensuales</div>
        <div class="doc-ptitle">${titleShow ? esc(title) : esc(client)}</div>
        ${company ? `<div class="doc-tagline">${esc(company)}</div>` : ""}
      </div>
      <div class="doc-meta">
        <div class="doc-meta-item"><div class="doc-meta-lbl">Tipo</div><div class="doc-meta-val">${esc(type)}</div></div>
        <div class="doc-meta-item"><div class="doc-meta-lbl">Fecha</div><div class="doc-meta-val">${fmtDate(date)}</div></div>
        <div class="doc-meta-item"><div class="doc-meta-lbl">Horas</div><div class="doc-meta-val">${esc(hours)}</div></div>
      </div>
      <div class="doc-body">
        <div class="doc-section">
          <div class="doc-section-title">Resumen</div>
          <div class="muted">${esc(desc || "Plan mensual de soporte, mantenimiento y acompañamiento.")}</div>
        </div>
        <div class="doc-section">
          <div class="doc-section-title">Incluye</div>
          ${itemsHTML || '<p class="muted">Sin ítems definidos.</p>'}
        </div>
        <div class="doc-section">
          <div class="doc-section-title">Opciones</div>
          <div class="plan-grid">
            <div class="plan-card">
              <div class="plan-badge">Bienvenida</div>
              <div class="plan-title">Bienvenida</div>
              <div class="plan-hours">4 hs/mes</div>
              <div class="plan-desc">Acompañamiento inicial, ajustes livianos y resolución de dudas.</div>
            </div>
            <div class="plan-card">
              <div class="plan-badge">Onboarding</div>
              <div class="plan-title">Onboarding</div>
              <div class="plan-hours">8 hs/mes</div>
              <div class="plan-desc">Implementación, iteración operativa y seguimiento del avance.</div>
            </div>
          </div>
        </div>
      </div>
      <div class="doc-signature">
        ${firmaHTML("Por Meteoro Agencia", "Matías Bongiovanni", "CEO & Fundador — Meteoro")}
        ${firmaHTML("Por "+esc(company||"el cliente"), esc(client), esc(company))}
      </div>
      <div class="doc-footer">
        <div class="doc-footer-contacts">
          <div class="dfc-item"><span class="dfc-lbl">WhatsApp</span><span class="dfc-val">+54 9 3472 548379</span></div>
          <div class="dfc-item"><span class="dfc-lbl">Email</span><span class="dfc-val">contacto@meteoro.com.ar</span></div>
          <div class="dfc-item"><span class="dfc-lbl">Web</span><span class="dfc-val">meteoro.com.ar</span></div>
        </div>
        <div class="doc-footer-logo"><img src="${LOGO}" alt="Meteoro"></div>
      </div>
    </div>`;
}
function printFit(){ window.print(); }
window.onload = function(){ document.getElementById("f-fecha").value = today(); up(); };

function saveToCrm() {
  const payload = { tipo: tipo, cliente: gv('f-cliente') || '', empresa: gv('f-empresa') || '', fecha: today() };
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'meteoro-planes-saved', payload }, '*');
    }
  } catch(e) {}
}
</script>
