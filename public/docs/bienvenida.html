<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carta de Bienvenida — Meteoro</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;background:#1a1a1a;display:flex;min-height:100vh}

  /* ─── PANEL FORM ─── */
  #panel-form{width:380px;min-width:340px;background:#111;color:#e8e8e8;display:flex;flex-direction:column;border-right:1px solid #252525;position:sticky;top:0;height:100vh;overflow:hidden}
  .form-brand{background:#000;padding:18px 22px;border-bottom:1px solid #222;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .form-brand img{height:28px;opacity:.8}
  .fb-title{font-size:13px;font-weight:600;color:#fff;letter-spacing:.5px}
  .fb-sub{font-size:9px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .form-body{padding:16px 18px;flex:1;overflow-y:auto}
  .form-section{margin-bottom:20px}
  .form-section-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #1e1e1e}
  .form-group{margin-bottom:8px}
  label{display:block;font-size:10px;color:#777;margin-bottom:3px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
  input,textarea,select{width:100%;background:#181818;border:1px solid #2a2a2a;color:#e8e8e8;padding:7px 10px;font-size:12px;font-family:'Montserrat',sans-serif;border-radius:3px;outline:none;transition:border-color .15s}
  input:focus,textarea:focus{border-color:#444}
  textarea{resize:vertical;min-height:80px}
  .form-row{display:flex;gap:8px}
  .form-row .form-group{flex:1}
  .step-block{background:#181818;border:1px solid #252525;border-radius:3px;padding:8px 10px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
  .step-block input{flex:1;margin:0}
  .btn-rm{background:none;border:none;color:#444;cursor:pointer;font-size:16px;line-height:1;padding:0 3px;transition:color .15s;flex-shrink:0}
  .btn-rm:hover{color:#e55}
  .btn-add{width:100%;padding:7px;background:#181818;border:1px dashed #2e2e2e;color:#555;font-size:11px;font-family:'Montserrat',sans-serif;cursor:pointer;border-radius:3px;margin-top:4px;transition:all .15s}
  .btn-add:hover{border-color:#444;color:#999}
  .form-footer{padding:12px 18px;background:#111;border-top:1px solid #1e1e1e;flex-shrink:0}
  .btn-pdf{width:100%;padding:11px;background:#fff;color:#000;border:none;font-family:'Montserrat',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:background .15s}
  .btn-pdf:hover{background:#ddd}

  /* ─── PANEL PREVIEW ─── */
  #panel-preview{flex:1;padding:40px 30px;display:flex;flex-direction:column;align-items:center;background:#2a2a2a;overflow-y:auto}

  /* ─── DOCUMENTO ─── */
  .doc{width:794px;background:#070707;color:#fff;box-shadow:0 8px 40px rgba(0,0,0,.7);font-family:'Montserrat',sans-serif;position:relative;min-height:1100px;overflow:hidden}

  .marco-documento{position:absolute;top:20px;bottom:20px;left:20px;right:20px;border:1px solid rgba(255,255,255,.15);pointer-events:none;z-index:5}
  .marco-documento::before,.marco-documento::after{content:'';position:absolute;width:14px;height:14px;border:1px solid rgba(255,255,255,.6)}
  .marco-documento::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .marco-documento::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

  .efecto-luz{position:absolute;top:10%;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 65%);z-index:1;pointer-events:none}

  .doc-container{padding:55px 48px;position:relative;z-index:2}

  .doc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}
  .doc-header img{height:120px;filter:drop-shadow(0 0 12px rgba(255,255,255,.1))}
  .doc-header-right{text-align:right}
  .dh-label{font-size:9px;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase}
  .dh-client{font-size:15px;font-weight:500;margin-top:4px;letter-spacing:.5px}

  .doc-title-band{position:relative;padding:28px 0;margin-bottom:38px;text-align:center}
  .doc-title-band::before,.doc-title-band::after{content:'';position:absolute;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)}
  .doc-title-band::before{top:0}.doc-title-band::after{bottom:0}
  .acento-linea{position:absolute;left:50%;transform:translateX(-50%);width:6px;height:6px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8)}
  .acento-arriba{top:-3px}.acento-abajo{bottom:-3px}
  .doc-cot-label{font-size:9px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:8px}
  .doc-ptitle{font-size:24px;font-weight:200;letter-spacing:4px;text-transform:uppercase;margin:0;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.4)}

  .welcome-message{font-size:14px;font-weight:300;line-height:1.9;color:rgba(255,255,255,.85);text-align:center;margin-bottom:45px;padding:0 20px}
  .welcome-message strong{font-weight:500;color:#fff}

  .team-section{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);padding:26px;margin-bottom:45px;display:flex;justify-content:space-between;align-items:center}
  .team-title{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:12px;font-weight:600}
  .team-name{font-size:18px;font-weight:300;letter-spacing:1px;margin-bottom:4px}
  .team-role{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.6)}
  .team-contact{text-align:right}
  .team-contact-row{font-size:11px;color:rgba(255,255,255,.75);margin-bottom:7px;display:flex;justify-content:flex-end;align-items:center;gap:10px}
  .team-contact-lbl{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.35)}

  .doc-subsection-title{font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:22px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2)}

  .steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:55px}
  .step-card{border-top:1px solid rgba(255,255,255,.3);padding-top:14px}
  .step-number{font-size:20px;font-weight:200;color:#fff;margin-bottom:8px;opacity:.75}
  .step-text{font-size:11px;font-weight:400;color:rgba(255,255,255,.65);line-height:1.5}

  .signatures-section{display:flex;justify-content:space-between;margin-top:55px;margin-bottom:45px}
  .sig-block{width:42%}
  .sig-line{width:100%;height:1px;background:rgba(255,255,255,.35);margin-bottom:14px}
  .sig-company{font-size:8px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.45);margin-bottom:4px}
  .sig-name{font-size:13px;font-weight:500;color:#fff;margin-bottom:2px}
  .sig-role{font-size:10px;font-weight:300;color:rgba(255,255,255,.65);margin-bottom:8px}
  .sig-date{font-size:10px;color:rgba(255,255,255,.4)}

  .doc-footer{display:flex;justify-content:space-between;align-items:center;padding-top:26px;border-top:1px solid rgba(255,255,255,.1)}
  .doc-footer-contacts{display:flex;gap:36px}
  .dfc-item{display:flex;flex-direction:column}
  .dfc-lbl{font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:3px}
  .dfc-val{font-size:10px;font-weight:400;color:rgba(255,255,255,.75)}

  @media print{
    body{background:#070707!important}
    #panel-form{display:none!important}
    #panel-preview{padding:0!important;background:#070707!important;align-items:flex-start!important}
    .doc{box-shadow:none!important;width:100%!important;min-height:auto!important}
    @page{margin:0;size:A4}
  }
</style>
</head>

let steps = [
  'Confirmá el pago del 50% inicial para dar inicio formal al proyecto.',
  'Agendamos una llamada de kick-off para definir accesos, datos y alcance final.',
  'Comenzamos el desarrollo. Te mantenemos al tanto en cada etapa.'
];

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function gv(id){ const e=document.getElementById(id); return e?e.value.trim():'' }
function today(){ return new Date().toISOString().slice(0,10) }
function fmtDate(iso){ if(!iso)return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y }

function renderSteps(){
  const l = document.getElementById('steps-list');
  l.innerHTML = '';
  steps.forEach((s,i)=>{
    l.innerHTML += `<div class="step-block">
      <input type="text" value="${esc(s)}" placeholder="Descripción del paso" oninput="steps[${i}]=this.value;up()">
      <button class="btn-rm" onclick="rmStep(${i})">×</button>
    </div>`;
  });
}
function addStep(){ steps.push(''); renderSteps(); up() }
function rmStep(i){ if(steps.length===1)return; steps.splice(i,1); renderSteps(); up() }

function up(){
  const cli = gv('f-cliente')||'Cliente';
  const emp = gv('f-empresa');
  const fecha = gv('f-fecha')||today();
  const msg = gv('f-mensaje')||'Queremos darte la bienvenida a Meteoro y agradecerte la confianza que depositaste en nosotros. Estamos comprometidos con el éxito de tu proyecto.';
  const nombreMeteoro = gv('f-nombre-meteoro')||'Matías Bongiovanni';
  const rolMeteoro = gv('f-rol-meteoro')||'CEO & Fundador';
  const wa = gv('f-wa')||'+54 9 3472 54-8379';
  const email = gv('f-email')||'contacto@meteoro.com';
  const firmaCliente = gv('f-firma-cliente');
  const firmaCargo = gv('f-firma-cargo-cliente')||'Representante';

  const stepsHtml = steps.filter(s=>s.trim()).map((s,i)=>`
    <div class="step-card">
      <div class="step-number">0${i+1}</div>
      <div class="step-text">${esc(s)}</div>
    </div>`).join('');

  document.getElementById('doc').innerHTML = `
  <div class="marco-documento"></div>
  <div class="efecto-luz"></div>
  <div class="doc-container">

    <div class="doc-header">
      <img src="${LOGO}" alt="Meteoro">
      <div class="doc-header-right">
        <div class="dh-label">Carta de Bienvenida</div>
        <div class="dh-client">${esc(emp||cli)}</div>
      </div>
    </div>

    <div class="doc-title-band">
      <div class="acento-linea acento-arriba"></div>
      <div class="doc-cot-label">Bienvenido/a</div>
      <h2 class="doc-ptitle">Bienvenido/a a Meteoro</h2>
      <div class="acento-linea acento-abajo"></div>
    </div>

    <div class="welcome-message">${esc(msg).replace(/\n/g,'<br>')}</div>

    <div class="team-section">
      <div>
        <div class="team-title">Tu contacto en Meteoro</div>
        <div class="team-name">${esc(nombreMeteoro)}</div>
        <div class="team-role">${esc(rolMeteoro)}</div>
      </div>
      <div class="team-contact">
        <div class="team-contact-row"><span class="team-contact-lbl">WhatsApp</span><span>${esc(wa)}</span></div>
        <div class="team-contact-row"><span class="team-contact-lbl">Email</span><span>${esc(email)}</span></div>
        <div class="team-contact-row"><span class="team-contact-lbl">Horario</span><span>Lun–Vie 9:00–18:00 ART</span></div>
      </div>
    </div>

    <div class="doc-subsection-title">Próximos Pasos</div>
    <div class="steps-grid">${stepsHtml}</div>

    <div class="signatures-section">
      <div class="sig-block">
        <div class="sig-line"></div>
        <div class="sig-company">Meteoro Agencia</div>
        <div class="sig-name">${esc(nombreMeteoro)}</div>
        <div class="sig-role">${esc(rolMeteoro)}</div>
        <div class="sig-date">Fecha: ${fmtDate(fecha)}</div>
      </div>
      <div class="sig-block">
        <div class="sig-line"></div>
        <div class="sig-company">${esc(emp||cli)}</div>
        <div class="sig-name">${esc(firmaCliente)}</div>
        <div class="sig-role">${esc(firmaCargo)}</div>
        <div class="sig-date">Fecha: _____ / _____ / _________</div>
      </div>
    </div>

    <div class="doc-footer">
      <div class="doc-footer-contacts">
        <div class="dfc-item"><span class="dfc-lbl">Email</span><span class="dfc-val">${esc(email)}</span></div>
        <div class="dfc-item"><span class="dfc-lbl">Teléfono</span><span class="dfc-val">${esc(wa)}</span></div>
        <div class="dfc-item"><span class="dfc-lbl">Instagram</span><span class="dfc-val">@meteoroar</span></div>
      </div>
      <img src="${LOGO}" alt="Meteoro" style="height:120px;opacity:.3;">
    </div>

  </div>`;
}

document.getElementById('f-fecha').value = today();
const _p = new URLSearchParams(location.search);
if(_p.get('cliente')) document.getElementById('f-cliente').value = _p.get('cliente');
if(_p.get('empresa')) document.getElementById('f-empresa').value = _p.get('empresa');
renderSteps();
up();
</script>
